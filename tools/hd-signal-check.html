<!doctype html><meta charset="utf-8"><title>HD analog validation</title><style>body{background:#111;color:white;font:14px monospace}canvas{width:960px}</style><h1>Actual 1080p analog signal pipeline</h1><pre id="out">Running…</pre><canvas id="view"></canvas><script type="module">
import * as THREE from '../vendor/three-r186/three.module.js';
import {createHDAnalogPass,HD_SIGNAL as S} from '../hd-analog.js?v=1';
const bytes=new Uint8Array(S.width*S.height*4),colors=[[255,255,255],[255,255,0],[0,255,255],[0,255,0],[255,0,255],[255,0,0],[0,0,255],[0,0,0]];
for(let y=0;y<S.height;y++)for(let x=0;x<S.width;x++){const i=(y*S.width+x)*4,c=y<540?colors[Math.floor(x/(S.width/8))]:[Math.round(x/(S.width-1)*255),Math.round(x/(S.width-1)*255),Math.round(x/(S.width-1)*255)];bytes.set([...c,255],i);}
const texture=new THREE.DataTexture(bytes,S.width,S.height,THREE.RGBAFormat);texture.needsUpdate=true;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view')});renderer.setSize(S.width,S.height,false);
let resolveFrame;const output=document.getElementById('out');
try{
 const pass=createHDAnalogPass(renderer,{videoSource:texture,onFrame:({target,stats})=>{const pixels=new Uint8Array(S.width*S.height*4);renderer.readRenderTargetPixels(target,0,0,S.width,S.height,pixels);resolveFrame({pixels,stats});}});pass.controls.automaticHum=false;
 let total=0,count=0,worst=0;
 for(let frame=0;frame<3;frame++){const ready=new Promise(resolve=>resolveFrame=resolve);pass.render(frame/60+(frame?1e-7:0));const {pixels,stats}=await ready;
  for(let y=80;y<S.height-80;y+=31)for(let x=30;x<S.width-30;x+=37){if(y>500&&y<580||x%240<20||x%240>220)continue;for(let c=0;c<3;c++){const error=Math.abs(pixels[((S.height-1-y)*S.width+x)*4+c]-bytes[(y*S.width+x)*4+c]);total+=error;count++;worst=Math.max(worst,error);}}
  output.textContent=`Frame ${frame}: mean error ${(total/count).toFixed(3)} / 255; max ${worst}; readback ${stats.readbackBytes} bytes; worker ${stats.receiverMilliseconds.toFixed(2)} ms`;
 }
 if(total/count>2||worst>8)throw new Error('HD clean-signal fidelity regression');output.textContent+='\nClean RGB round trip: PASS';
 const interference=new Float32Array(S.samplesPerLine*(S.linesPerFrame+2*S.guard));
 interference.fill(.05);
 const injected=new THREE.DataTexture(interference,S.samplesPerLine,S.linesPerFrame+2*S.guard,THREE.RedFormat,THREE.FloatType);injected.needsUpdate=true;
 pass.controls.injection=injected;pass.controls.injectionGain=1;
 let injectedPixels;
 for(let frame=3;frame<12;frame++){const ready=new Promise(resolve=>resolveFrame=resolve);pass.render(frame/60+1e-7);injectedPixels=(await ready).pixels;}
 function difference(pixels){let sum=0,n=0;for(let y=80;y<S.height-80;y+=61)for(let x=30;x<S.width-30;x+=71){if(y>500&&y<580||x%240<20||x%240>220)continue;for(let c=0;c<3;c++){sum+=Math.abs(pixels[((S.height-1-y)*S.width+x)*4+c]-bytes[(y*S.width+x)*4+c]);n++;}}return sum/n;}
 const dcError=difference(injectedPixels);if(dcError>2)throw new Error('Back-porch clamp failed on injected DC: '+dcError);
 output.textContent+='\nInjected DC rejected by receiver clamp: PASS';
 for(let row=0;row<S.linesPerFrame+2*S.guard;row++)for(let x=0;x<S.samplesPerLine;x++)interference[row*S.samplesPerLine+x]=.05*Math.cos((x+(S.linesPerFrame+S.guard-row-1)*S.samplesPerLine-S.baseDelaySamples)*Math.PI/2);
 injected.needsUpdate=true;
 const ready=new Promise(resolve=>resolveFrame=resolve);pass.render(12/60+1e-7);const altered=(await ready).pixels,error=difference(altered);
 if(error<2)throw new Error('Waveform interferer did not affect decoded picture');
 output.textContent+='\nCarrier voltage injection changes decoded RGB: PASS ('+error.toFixed(2)+'/255)\nPASS';
 pass.controls.injection=null;pass.render(13/60+1e-7);
}catch(error){output.textContent+='\nFAIL: '+error.message;console.error(error);}
</script>
